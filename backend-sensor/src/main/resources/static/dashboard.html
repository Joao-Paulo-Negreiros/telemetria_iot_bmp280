<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetria em Tempo Real - UFC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-sensor { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .card-sensor:hover { transform: translateY(-5px); }
        .chart-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="container my-5">
    <h2 class="text-center mb-4 text-primary fw-bold">Painel de Monitoramento Híbrido (IoT)</h2>
    <p class="text-center text-muted mb-5">Leituras simultâneas dos sensores BMP280 e DS18B20 integradas ao Backend Java</p>

    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="card card-sensor bg-white p-4 border-start border-primary border-4">
                <h6 class="text-muted text-uppercase fw-bold">BMP280 - Temperatura</h6>
                <h2 class="display-6 fw-bold text-dark" id="atual-temp-bmp">--.- °C</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-sensor bg-white p-4 border-start border-info border-4">
                <h6 class="text-muted text-uppercase fw-bold">BMP280 - Pressão</h6>
                <h2 class="display-6 fw-bold text-dark" id="atual-pres-bmp">---- hPa</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-sensor bg-white p-4 border-start border-warning border-4">
                <h6 class="text-muted text-uppercase fw-bold">DS18B20 - Temperatura</h6>
                <h2 class="display-6 fw-bold text-dark" id="atual-temp-ds">--.- °C</h2>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="chart-container">
                <h5 class="fw-bold mb-4 text-secondary">Gráfico Comparativo de Estabilidade Térmica</h5>
                <canvas id="graficoSimultaneo" style="width: 100%; height: 400px;"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    // Configuração Inicial do Gráfico do Chart.js
    const ctx = document.getElementById('graficoSimultaneo').getContext('2d');
    const grafico = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [], // Armazenará os Timestamps (Hora da leitura)
            datasets: [
                {
                    label: 'Temperatura BMP280 (°C)',
                    data: [],
                    borderColor: '#0d6efd', // Azul
                    backgroundColor: 'rgba(13, 110, 253, 0.1)',
                    borderWidth: 2,
                    tension: 0.3,
                    yAxisID: 'y'
                },
                {
                    label: 'Temperatura DS18B20 (°C)',
                    data: [],
                    borderColor: '#ffc107', // Amarelo/Laranja
                    backgroundColor: 'rgba(255, 193, 7, 0.1)',
                    borderWidth: 2,
                    tension: 0.3,
                    yAxisID: 'y'
                }
            ]
        },
        options: {
            responsive: true,
            scales: {
                x: { title: { display: true, text: 'Horário da Coleta' } },
                y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Temperatura (°C)' } }
            }
        }
    });

    // Função que consome a API do Spring Boot
    async function buscarDadosDoServidor() {
        try {
            const resposta = await fetch('http://localhost:8081/api/sensor/dados');
            const todosOsDados = await resposta.json();

            if (todosOsDados.length === 0) return;

            // --- O PULO DO GATO: FILTRAR OS DADOS NO JAVASCRIPT ---
            const dadosBMP = todosOsDados.filter(item => item.sensor === 'BMP280');
            const dadosDS = todosOsDados.filter(item => item.sensor === 'DS18B20');

            // Atualizar os Cards com a última leitura de cada array
            if (dadosBMP.length > 0) {
                const ultimoBMP = dadosBMP[dadosBMP.length - 1];
                document.getElementById('atual-temp-bmp').innerText = ultimoBMP.temperatura.toFixed(1) + ' °C';
                document.getElementById('atual-pres-bmp').innerText = ultimoBMP.pressao.toFixed(1) + ' hPa';
            }
            if (dadosDS.length > 0) {
                const ultimoDS = dadosDS[dadosDS.length - 1];
                document.getElementById('atual-temp-ds').innerText = ultimoDS.temperatura.toFixed(1) + ' °C';
            }

            // Formatar os horários para o Eixo X do gráfico usando os dados do BMP como base de tempo
            const labelsFormatadas = dadosBMP.map(item => {
                const data = new Date(item.dataHora);
                return data.toLocaleTimeString('pt-BR');
            });

            // Extrair apenas os arrays numéricos de temperatura para o gráfico
            const temperaturasBMP = dadosBMP.map(item => item.temperatura);
            const temperaturasDS = dadosDS.map(item => item.temperatura);

            // Injetar os novos dados estruturados dentro do Chart.js
            grafico.data.labels = labelsFormatadas;
            grafico.data.datasets[0].data = temperaturasBMP;
            grafico.data.datasets[1].data = temperaturasDS;

            // Atualiza visualmente o gráfico na tela
            grafico.update();

        } catch (erro) {
            console.error("Erro ao buscar dados do Spring Boot:", erro);
        }
    }

    // Faz a primeira busca imediatamente ao abrir a página
    buscarDadosDoServidor();

    // Cria um loop para atualizar o dashboard automaticamente a cada 3 segundos
    setInterval(buscarDadosDoServidor, 3000);
</script>

</body>
</html>
